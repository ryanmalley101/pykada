# Automatically publishes to PyPI when pykada/__init__.py's __version__
# changes on master. Bump the version, push (or merge a PR), and the rest
# happens on its own: build -> publish to PyPI -> tag + GitHub Release.
#
# Pushes that don't change the version are a no-op (the check-version job
# exits early, no build is triggered).

name: Auto Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          VERSION=$(grep -m1 '__version__' pykada/__init__.py | sed -E 's/__version__ = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version has already been released
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    # A reusable workflow's job permissions are capped by whatever the
    # caller grants here — python-publish.yml's pypi-publish job needs
    # id-token: write for PyPI trusted publishing, so it must be granted
    # at this call site too, not just declared inside the callee.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python-publish.yml
    secrets: inherit

  tag-and-release:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
