# Publishes to PyPI in two ways:
#   1. Manually: publish a GitHub Release by hand -> build + publish.
#   2. Automatically: push a version bump (pykada/__init__.py's
#      __version__) to master -> build + publish + tag + GitHub Release.
#
# Everything lives in this one workflow file deliberately. PyPI's trusted
# publishing does not support reusable/nested workflows (a job_workflow_ref
# that differs from workflow_ref gets rejected with "invalid-publisher"),
# so the build+publish steps cannot be split into a workflow called via
# `uses:` from elsewhere -- the trusted publisher on PyPI is configured
# against this exact file.
#
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          VERSION=$(grep -m1 '__version__' pykada/__init__.py | sed -E 's/__version__ = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version has already been released
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release-build:
    needs: [check-version]
    # Runs for a manually published GitHub Release unconditionally, or
    # for a push to master only when the version actually changed.
    if: |
      always() &&
      (github.event_name == 'release' || needs.check-version.outputs.should_release == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  tag-and-release:
    needs: [check-version, pypi-publish]
    if: |
      github.event_name == 'push' &&
      needs.check-version.outputs.should_release == 'true' &&
      needs.pypi-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
